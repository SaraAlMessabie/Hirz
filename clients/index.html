<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1629">
<title>Hirz — your safeguard against scams</title>
<style>
  :root {
    --bg: #0b1629; --bg2: #0e2340; --card: #12233b; --line: #1f3656;
    --text: #e8eef9; --muted: #93a8c4; --cyan: #38bdf8;
    --red: #e63946;   --red-bg: #2b1219;
    --amber: #f59e0b; --amber-bg: #2a2010;
    --green: #22c55e; --green-bg: #0f2418;
    --grey: #94a3b8;  --grey-bg: #18243a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--text);
    background: radial-gradient(120% 60% at 50% 0%, var(--bg2) 0%, var(--bg) 60%) fixed, var(--bg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif; }
  html[dir=rtl] body { line-height: 1.6; }
  .phone { max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; }

  .hero { position: relative; height: 150px; overflow: hidden;
    background: #0b1629 url("img/header_bg.jpg") center bottom / cover no-repeat; }
  .hero img { position: absolute; left: 50%; top: 6px; height: 120px; transform: translateX(-50%);
    filter: drop-shadow(0 0 18px rgba(56,189,248,.25)); }
  .hero .tag { position: absolute; bottom: 8px; width: 100%; text-align: center; font-size: 13px; color: #cfe3f7; }
  .marks { position: absolute; top: 12px; display: flex; gap: 3px; }
  .marks i { width: 4px; height: 10px; background: #e2e8f0; transform: skewX(-30deg); border-radius: 1px; }
  .marks.l { left: 14px; } .marks.r { right: 14px; }
  .flag { display: flex; height: 4px; }
  .flag i { flex: 1; } .flag i:nth-child(1){background:#00732f} .flag i:nth-child(2){background:#fff}
  .flag i:nth-child(3){background:#000} .flag i:nth-child(4){background:#ce1126}
  html[dir=rtl] .flag { flex-direction: row-reverse; }

  .langbar { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 0; }
  .langbar button { padding: 6px 11px; font-size: 13.5px; font-weight: 600; border-radius: 999px;
    background: rgba(18,35,59,.9); color: var(--text); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
  .langbar button svg { width: 16px; height: 16px; }
  .langbar #lang { border-color: #2b6496; color: #cfe9ff; }
  .toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); max-width: 340px; z-index: 10;
    background: #1b3a5e; color: #e8f4ff; border: 1px solid #2b6496; border-radius: 12px; padding: 10px 14px;
    font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }

  .banner { display: none; margin: 10px 18px 0; padding: 10px 12px; border-radius: 10px; font-size: 13.5px;
    background: var(--amber-bg); border: 1px solid #5a4410; color: #fcd34d; overflow-wrap: anywhere; }
  .banner.on { display: block; }

  main { padding: 12px 18px 0; }
  .panel { display: none; } .panel.on { display: block; }
  h1 { font-size: 21px; margin: 0 0 2px; }
  .lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

  form { display: flex; flex-direction: column; gap: 10px; }
  label.f { font-size: 13px; color: var(--muted); margin-bottom: -6px; }
  input, select {
    width: 100%; padding: 13px 14px; font: inherit; font-size: 16px; color: var(--text);
    background: rgba(18,35,59,.85); border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  input[dir=ltr] { text-align: left; }
  html[dir=rtl] input[dir=ltr]::placeholder { text-align: right; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; }
  html[dir=rtl] select { background-position: 20px 55%, 14px 55%; }
  input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,189,248,.18); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px; cursor: pointer;
    color: #04121f; background: linear-gradient(180deg, #5ccdfb, #22a6e0);
  }
  button:disabled { opacity: .6; cursor: wait; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .danger { background: var(--red); color: #fff; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; margin-bottom: 14px;
    background: rgba(18,35,59,.85); border: 1px solid var(--line); border-radius: 12px; }
  .seg button { padding: 9px; font-size: 14px; background: transparent; color: var(--muted); border-radius: 9px; }
  .seg button.on { background: #1b3a5e; color: var(--text); }

  .spinner { display: none; align-items: center; gap: 10px; color: var(--muted); margin-top: 16px; font-size: 14px; }
  .spinner.on { display: flex; }
  .spinner i { flex: none; width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--cyan); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 12px; overflow-wrap: anywhere;
    background: var(--grey-bg); border: 1px solid var(--line); font-size: 14px; }
  .error.on { display: block; }

  .result { margin-top: 18px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
  .result[hidden] { display: none; }
  .verdict { padding: 20px 18px 16px; text-align: center; }
  .verdict .word { font-size: 34px; font-weight: 800; letter-spacing: .6px; line-height: 1.15; }
  html[dir=rtl] .verdict .word { letter-spacing: 0; }
  .verdict .sub { margin-top: 6px; font-size: 15px; }
  .verdict .score { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); margin: 8px auto 0; max-width: 240px; overflow: hidden; display: flex; }
  .bar b { display: block; height: 100%; width: 0; transition: width .6s ease; }
  .v-red   { background: var(--red-bg); }   .v-red   .word, .v-red   .sub { color: var(--red); }   .v-red   .bar b { background: var(--red); }
  .v-amber { background: var(--amber-bg); } .v-amber .word, .v-amber .sub { color: var(--amber); } .v-amber .bar b { background: var(--amber); }
  .v-green { background: var(--green-bg); } .v-green .word, .v-green .sub { color: var(--green); } .v-green .bar b { background: var(--green); }
  .v-grey  { background: var(--grey-bg); }  .v-grey  .word, .v-grey  .sub { color: var(--grey); }  .v-grey  .bar b { background: var(--grey); }

  .body { padding: 16px 18px 18px; }
  .host { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 12px; }
  .host b { color: var(--text); font-weight: 600; }
  h2 { font-size: 15px; margin: 0 0 8px; padding-inline-start: 9px; border-inline-start: 3px solid var(--cyan); }
  ul.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.reasons li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; font-size: 15px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; margin-top: 1px; }
  .risk .dot, .dot.no { background: var(--red-bg); color: var(--red); }
  .safe .dot, .dot.yes { background: var(--green-bg); color: var(--green); }
  .neutral .dot, .dot.na { background: var(--grey-bg); color: var(--grey); }
  .empty { color: var(--muted); font-size: 14px; }
  .note { margin-top: 14px; font-size: 12.5px; color: var(--muted); }

  .signals { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .signals div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .signals small { color: var(--muted); margin-inline-start: auto; text-align: end; }

  .actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .evidence, .proceed { display: none; flex-direction: column; gap: 8px; }
  .evidence.on, .proceed.on { display: flex; }
  .evidence button { background: linear-gradient(180deg, #1d4f7a, #163d61); color: #e8f4ff; border: 1px solid #2b6496; }
  .msg { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .msg.err { color: #fca5a5; }
  .proceed .warn { display: none; font-size: 14px; color: var(--red); background: var(--red-bg);
    border: 1px solid #5b1d22; border-radius: 10px; padding: 10px 12px; }
  .proceed .warn.on { display: block; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
  .item > button { width: 100%; text-align: start; background: transparent; color: var(--text); padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; border-radius: 0; font-weight: 500; }
  .item .nm { font-weight: 600; font-size: 15px; }
  .item .meta { grid-column: 1; font-size: 12.5px; color: var(--muted); }
  .chip { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 11.5px; font-weight: 700;
    padding: 4px 8px; border-radius: 999px; letter-spacing: .3px; white-space: nowrap; }
  .chip.red { background: var(--red-bg); color: var(--red); } .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .chip.green { background: var(--green-bg); color: var(--green); } .chip.grey { background: var(--grey-bg); color: var(--grey); }
  .badge { font-size: 10.5px; color: #c4b5fd; border: 1px solid #4c3d8f; border-radius: 6px; padding: 0 5px; margin-inline-start: 6px; white-space: nowrap; }
  .item .detail { display: none; padding: 0 14px 14px; }
  .item.open .detail { display: block; }

  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    background: rgba(9,18,34,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs .inner { width: 100%; max-width: 390px; display: grid; grid-template-columns: repeat(3, 1fr); }
  nav.tabs button { background: transparent; color: var(--muted); border-radius: 0; padding: 9px 4px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--cyan); box-shadow: inset 0 2px 0 var(--cyan); }
  footer { margin-top: 22px; padding: 0 18px; font-size: 12px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="phone">
  <header class="hero">
    <div class="marks l"><i></i><i></i><i></i><i></i></div>
    <div class="marks r"><i></i><i></i><i></i><i></i></div>
    <img src="img/hirz_logo.png" alt="Hirz · حرز">
    <div class="tag" data-t="tag"></div>
  </header>
  <div class="flag"><i></i><i></i><i></i><i></i></div>

  <div class="langbar">
    <button id="other" type="button" aria-label="Other languages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <span data-t="other"></span></button>
    <button id="lang" type="button"></button>
  </div>
  <div id="banner" class="banner" role="status"></div>

  <main>
    <!-- ============ LINK ============ -->
    <section id="p-link" class="panel on">
      <h1 data-t="link.h1"></h1>
      <p class="lead" data-t="link.lead"></p>
      <form id="f-link" autocomplete="off">
        <input id="link" type="text" inputmode="url" dir="ltr" placeholder="https://example.com/login" data-t-aria="link.h1" required>
        <button type="submit" data-t="link.btn"></button>
      </form>
      <div class="spinner"><i></i><span data-t="link.spin"></span></div>
      <div class="error" role="alert"></div>
      <div class="result" hidden>
        <div class="verdict"><div class="word"></div><div class="sub"></div><div class="score"></div><div class="bar"><b></b></div></div>
        <div class="body">
          <div class="host"></div>
          <h2 data-t="why"></h2>
          <ul class="reasons"></ul>
          <div class="actions">
            <div id="evidence" class="evidence">
              <button id="evBtn" type="button"></button>
              <div id="evMsg" class="msg"></div>
            </div>
            <div id="proceed" class="proceed">
              <button id="proceedBtn" type="button" class="ghost" data-t="proceed"></button>
              <div id="warn" class="warn"><span data-t="warn"></span>
                <div style="margin-top:10px"><button id="openBtn" type="button" class="danger" style="width:100%" data-t="open"></button></div>
              </div>
            </div>
          </div>
          <div class="note" data-t="disclaimer"></div>
        </div>
      </div>
    </section>

    <!-- ============ NUMBER ============ -->
    <section id="p-number" class="panel">
      <h1 data-t="num.h1"></h1>
      <p class="lead" data-t="num.lead"></p>
      <form id="f-number" autocomplete="off">
        <label class="f" for="number" data-t="num.label"></label>
        <input id="number" type="tel" inputmode="tel" dir="ltr" placeholder="050 123 4567 · 600 50 2030" required>
        <label class="f" for="nbrand" data-t="num.brand"></label>
        <select id="nbrand" class="brands"><option value="" data-t="num.none"></option></select>
        <button type="submit" data-t="num.btn"></button>
      </form>
      <div class="spinner"><i></i><span data-t="num.spin"></span></div>
      <div class="error" role="alert"></div>
      <div class="result" hidden>
        <div class="verdict"><div class="word"></div><div class="sub"></div><div class="score"></div><div class="bar"><b></b></div></div>
        <div class="body">
          <div class="host"></div>
          <h2 data-t="why"></h2>
          <ul class="reasons"></ul>
          <div class="note" data-t="num.note"></div>
        </div>
      </div>
    </section>

    <!-- ============ LISTING ============ -->
    <section id="p-listing" class="panel">
      <h1 data-t="lst.h1"></h1>
      <p class="lead" data-t="lst.lead"></p>
      <div class="seg" role="tablist">
        <button id="seg-form" class="on" type="button" role="tab" data-t="lst.one"></button>
        <button id="seg-demo" type="button" role="tab" data-t="lst.demo"></button>
      </div>

      <div id="l-form">
        <form id="f-listing" autocomplete="off">
          <label class="f" for="lbrand" data-t="lst.brand"></label>
          <select id="lbrand" class="brands" required><option value="" data-t="lst.choose"></option></select>
          <label class="f" for="lname" data-t="lst.name"></label>
          <input id="lname" type="text" data-t-ph="lst.name.ph">
          <label class="f" for="lphone" data-t="lst.phone"></label>
          <input id="lphone" type="tel" inputmode="tel" dir="ltr" placeholder="050 000 1234" required>
          <label class="f" for="laddr" data-t="lst.addr"></label>
          <input id="laddr" type="text" data-t-ph="lst.addr.ph">
          <div class="row2">
            <div><label class="f" for="lsite" data-t="lst.site"></label><input id="lsite" type="text" inputmode="url" dir="ltr" data-t-ph="optional"></div>
            <div><label class="f" for="lrev" data-t="lst.rev"></label><input id="lrev" type="number" min="0" dir="ltr" data-t-ph="optional"></div>
          </div>
          <button type="submit" data-t="lst.btn"></button>
        </form>
        <div class="spinner"><i></i><span data-t="lst.spin"></span></div>
        <div class="error" role="alert"></div>
        <div class="result" hidden>
          <div class="verdict"><div class="word"></div><div class="sub"></div></div>
          <div class="body"><div class="signals"></div><h2 data-t="why"></h2><ul class="reasons"></ul>
            <div class="note" data-t="disclaimer"></div></div>
        </div>
      </div>

      <div id="l-demo" hidden>
        <div class="spinner"><i></i><span data-t="lst.loading"></span></div>
        <div class="error" role="alert"></div>
        <div id="demo-list" class="list"></div>
        <button id="rescan" type="button" class="ghost" style="width:100%;margin-top:12px" data-t="lst.rescan"></button>
        <p class="note"><span data-t="lst.note1"></span> <span class="badge" style="margin:0" data-t="badge"></span>
          <span data-t="lst.note2"></span></p>
      </div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>
<div id="toast" class="toast" role="status"></div>

<nav class="tabs"><div class="inner">
  <button id="t-link" class="on" type="button" aria-controls="p-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span data-t="tab.link"></span></button>
  <button id="t-number" type="button" aria-controls="p-number">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span data-t="tab.number"></span></button>
  <button id="t-listing" type="button" aria-controls="p-listing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span data-t="tab.listing"></span></button>
</div></nav>

<script>

let LANG = "en";
try { LANG = localStorage.getItem("hirz.lang") || (navigator.language || "").startsWith("ar") && "ar" || "en"; } catch (_) {}
const t = (k, vars = {}) => {
  let s = (STR[LANG] && STR[LANG][k]) ?? STR.en[k] ?? k;
  if (typeof s === "string") for (const [a, b] of Object.entries(vars)) s = s.replaceAll("{" + a + "}", b);
  return s;
};
const iso = (s) => "⁦" + s + "⁩";      // keep numbers, domains, commands left-to-right inside Arabic
const BRANDS = {};                               // key -> {en, ar} display names
const brandName = (k) => (BRANDS[k] && BRANDS[k].name) || k || "";

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = LANG === "ar" ? "حرز — حمايتك من الاحتيال" : "Hirz — your safeguard against scams";
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  document.querySelectorAll("[data-t-ph]").forEach((el) => (el.placeholder = t(el.dataset.tPh)));
  document.querySelectorAll("[data-t-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.tAria)));
  $("lang").textContent = t("lang");
  $("lang").setAttribute("aria-label", LANG === "ar" ? "Switch to English" : "التبديل إلى العربية");
  $("other").setAttribute("aria-label", t("other"));
  $("foot").textContent = t("foot", { u: iso(BASE || location.origin) });
  if (!evBusy) resetEvidence(false);
  renderAll();
  showBanner();
}

const qs = new URLSearchParams(location.search);
const BASE = (qs.get("server") || (location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8001")).replace(/\/$/, "");
const $ = (id) => document.getElementById(id);
const within = (el, sel) => el.querySelector(sel);
const CMD_SERVER = "python -m uvicorn hirz_server:app --port 8001", CMD_API = "python -m uvicorn api:app --port 8000";

async function post(path, body) {
  const r = await fetch(BASE + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) {
    let detail = ""; try { detail = (await r.json()).detail || ""; } catch (_) {}
    const e = new Error(detail || t("err.http", { c: r.status })); e.http = true; throw e;
  }
  return r;
}
const errText = (err) => err instanceof TypeError ? t("err.server") + " " + iso(CMD_SERVER) : err.message;
function busy(el, on) { within(el, ".spinner").classList.toggle("on", on); el.querySelectorAll("form button").forEach((b) => (b.disabled = on)); }
function showError(el, msg) { const e = within(el, ".error"); e.textContent = msg; e.classList.add("on"); }
function clearOut(el) { within(el, ".error").classList.remove("on"); within(el, ".result").hidden = true; }
let toastTimer;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2600); }

let health = null;
function showBanner() {
  const b = $("banner"); b.classList.remove("on");
  if (health === "down") { b.textContent = t("err.server") + " " + iso(CMD_SERVER); b.classList.add("on"); }
  else if (health === "noapi") { b.textContent = t("err.api") + " " + iso(CMD_API); b.classList.add("on"); }
}

function verdictBlock(card, tone, word, sub, score) {
  const v = within(card, ".verdict"); v.className = "verdict v-" + tone;
  within(v, ".word").textContent = word; within(v, ".sub").textContent = sub;
  const sc = within(v, ".score"), bar = within(v, ".bar b");
  if (sc) sc.textContent = Number.isFinite(score) ? t("score", { s: score }) : "";
  if (bar) { bar.style.width = "0"; requestAnimationFrame(() => (bar.style.width = (Number.isFinite(score) ? score : 0) + "%")); }
}
function fillReasons(ul, items) {              // items: [{text, kind: "risk"|"safe"|"neutral"}]
  ul.innerHTML = "";
  if (!items.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = t("noreasons"); ul.append(li); return; }
  for (const it of items) {
    const li = document.createElement("li"); li.className = it.kind;
    const d = document.createElement("span"); d.className = "dot"; d.textContent = it.kind === "safe" ? "✓" : it.kind === "neutral" ? "–" : "!";
    const s = document.createElement("span"); s.textContent = it.text; li.append(d, s); ul.append(li);
  }
}
const apiReasons = (reasons, brand) => (reasons || []).map((r) => ({
  kind: r.direction === "safe" ? "safe" : "risk",
  text: LANG === "ar" ? (REASON_AR[r.code] || r.text || r.code).replace("{b}", brand || "الجهة") : (r.text || r.code || ""),
}));

}

$("lang").addEventListener("click", () => { LANG = LANG === "ar" ? "en" : "ar"; try { localStorage.setItem("hirz.lang", LANG); } catch (_) {} applyLang(); });

// ---------- LINK
const pLink = $("p-link");
let lastUrl = "", linkData = null, evBusy = false;
function resetEvidence(hide = true) {
  if (hide) ["evidence", "proceed", "warn"].forEach((id) => $(id).classList.remove("on"));
  $("evBtn").disabled = false; $("evBtn").textContent = t("ev.btn");
  $("evMsg").className = "msg"; $("evMsg").textContent = t("ev.hint");
}
function renderLink(scroll) {
  if (!linkData) return;
  const d = linkData, key = ["malicious", "suspicious", "clean"].includes(d.verdict) ? d.verdict : "unknown";
  const tone = { malicious: "red", suspicious: "amber", clean: "green", unknown: "grey" }[key];
  const [word, sub] = t("v.link." + key);
  const card = within(pLink, ".result");
  verdictBlock(card, tone, word, sub, d.score);
  const host = within(card, ".host"); host.innerHTML = "";
  if (d.host) {
    const b = document.createElement("b"); b.textContent = iso(d.reg_domain || d.host);
    host.append(t("realdomain"), b);
    if (d.reg_domain && d.host !== d.reg_domain) host.append(t("fulladdr", { h: iso(d.host) }));
  }
  fillReasons(within(card, ".reasons"), apiReasons(d.reasons));
  card.hidden = false;
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
$("f-link").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("link").value.trim(); if (!url) return;
  lastUrl = url; linkData = null; clearOut(pLink); resetEvidence(); busy(pLink, true);
  try {
    linkData = await (await post("/api/check", { url })).json();
    if (linkData.verdict === "malicious" || linkData.verdict === "suspicious") $("evidence").classList.add("on");
    if (linkData.verdict === "malicious") $("proceed").classList.add("on");
    renderLink(true);
  } catch (err) { showError(pLink, errText(err)); }
  finally { busy(pLink, false); }
});
$("evBtn").addEventListener("click", async () => {
  const btn = $("evBtn"), msg = $("evMsg");
  evBusy = true; btn.disabled = true; btn.textContent = t("ev.building"); msg.className = "msg"; msg.textContent = t("ev.collecting");
  try {
    const r = await post("/api/evidence", { url: lastUrl });
    const blob = await r.blob(), id = r.headers.get("X-Evidence-Id") || "report";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "hirz-evidence-" + id + ".pdf";
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    btn.textContent = t("ev.done");
    const h = r.headers.get("X-Bundle-SHA256") || "";
    msg.textContent = t("ev.saved", { f: iso(a.download) }) + (h ? t("ev.hash", { h: iso(h.slice(0, 16)) }) : "");
  } catch (err) { btn.textContent = t("ev.btn"); msg.className = "msg err"; msg.textContent = errText(err); }
  finally { btn.disabled = false; evBusy = false; }
});
$("proceedBtn").addEventListener("click", () => $("warn").classList.add("on"));
$("openBtn").addEventListener("click", () => window.open(/^https?:\/\//i.test(lastUrl) ? lastUrl : "https://" + lastUrl, "_blank", "noopener,noreferrer"));

// ---------- LISTING
const LTONE = { fabricated: "red", suspicious: "amber", genuine: "green", unverified: "grey" };
const SIGNALS = ["phone_in_official", "address_in_branches", "found_in_osm", "web_mentions", "website_official"];
const sigVal = (row, k) => k === "web_mentions"
  ? (row[k] === "" || row[k] == null ? "" : Number(row[k]) >= 2 ? "true" : "false") : String(row[k] ?? "");

function signalsBox(row) {
  const box = document.createElement("div"); box.className = "signals";
  for (const k of SIGNALS) {
    const v = sigVal(row, k), line = document.createElement("div"), d = document.createElement("span");
    d.className = "dot " + (v === "true" ? "yes" : v === "false" ? "no" : "na");
    d.textContent = v === "true" ? "✓" : v === "false" ? "✗" : "–";
    const s = document.createElement("span"); s.textContent = t("sig." + k);
    const sm = document.createElement("small"); sm.textContent = t(v === "true" ? "sig.yes" : v === "false" ? "sig.no" : "sig.na");
    line.append(d, s, sm); box.append(line);
  }
  return box;
}
// English: the scanner's own sentences. Arabic: built from the same check results.
function listingReasons(row) {
  if (LANG !== "ar") {
    return (row.reasons || []).map((text) => {
      const neutral = /not checked|could not be checked|neither confirm|no official branch list|has no website/i.test(text);
      const good = /published helpline|matches|is an official|shows a .* location|consistent with|appear on \d+ other/i.test(text);
      return { text, kind: good ? "safe" : neutral ? "neutral" : "risk" };
    });
  }
  const b = brandName(row.brand) || "الجهة", n = Number(row.disagreement_count || 0), out = [];
  const v = (k) => sigVal(row, k), phone = iso(row.phone || "");
  const kind = { fabricated: "risk", suspicious: "risk", genuine: "safe", unverified: "neutral" }[row.verdict] || "neutral";
  if (row.verdict === "fabricated") out.push({ kind, text: row.phone_verdict === "malicious"
      ? `مزيف بشكل قاطع: ${b} لا تنشر رقم هاتف متحرك شخصي كرقم لخدمة العملاء.`
      : `مزيف بشكل قاطع: ${n} من الفحوصات المستقلة تتعارض مع المعلومات الرسمية لـ${b}.` });
  else if (row.verdict === "genuine" && v("found_in_osm") === "false") out.push({ kind,
      text: `رقم الهاتف هو الرقم المنشور لـ${b}. الإعلان غير موجود على OpenStreetMap، لكن تغطية الخرائط في الإمارات غير مكتملة، لذا لا يعد ذلك وحده مؤشرا تحذيريا.` });
  else if (row.verdict === "genuine") out.push({ kind, text: `يتوافق مع المعلومات الرسمية لـ${b} في جميع الفحوصات التي أجريت.` });
  else if (row.verdict === "suspicious") out.push({ kind, text: `${n} من الفحوصات تتعارض مع المعلومات الرسمية لـ${b}. اتصل بالرقم المنشور على موقع ${b} الرسمي بدلا من ذلك.` });
  else out.push({ kind, text: "لا شيء يناقض هذا الإعلان، لكن لم يمكن التحقق من تفاصيل كافية لتأكيده." });

  if (!row.phone) out.push({ kind: "neutral", text: "لا يظهر رقم هاتف في الإعلان." });
  else if (v("phone_in_official") === "true") out.push({ kind: "safe", text: `رقم الهاتف ${phone} هو رقم خدمة العملاء المنشور لـ${b}.` });
  else out.push({ kind: "risk", text: `رقم الهاتف ${phone} ليس من الأرقام المنشورة لـ${b}` + (row.phone_verdict === "malicious" ? " (رقم هاتف متحرك شخصي)." : ".") });

  if (v("address_in_branches") === "true") out.push({ kind: "safe", text: `العنوان يطابق الفرع الرسمي «${row.matched_branch}» لـ${b}.` });
  else if (v("address_in_branches") === "false") out.push({ kind: "risk", text: `العنوان لا يطابق أي فرع في قائمة الفروع الرسمية لـ${b}.` });
  else out.push({ kind: "neutral", text: `لا توجد قائمة فروع رسمية لـ${b} حتى الآن، لذا لم يفحص العنوان.` });

  if (v("found_in_osm") === "true") out.push({ kind: "safe", text: `يظهر على OpenStreetMap موقع لـ${b} في هذا العنوان.` });
  else if (v("found_in_osm") === "false") out.push({ kind: "risk", text: `يعرض OpenStreetMap مواقع لـ${b}، لكن ليس في هذا العنوان.` });
  else out.push({ kind: "neutral", text: "لا يمكن لـOpenStreetMap تأكيد هذا الإعلان أو نفيه." });

  if (row.web_mentions === "" || row.web_mentions == null) out.push({ kind: "neutral", text: "لم يفحص الحضور على الإنترنت (لا يوجد مفتاح بحث)." });
  else if (Number(row.web_mentions) >= 2) out.push({ kind: "safe", text: `الاسم والرقم يظهران في ${row.web_mentions} مواقع أخرى.` });
  else out.push({ kind: "risk", text: `الاسم والرقم لا يكادان يظهران في أي موقع آخر (${row.web_mentions})، وهذا مؤشر على إعلان مختلق.` });

  let site = row.website || ""; try { if (site) site = new URL(/^https?:/i.test(site) ? site : "https://" + site).hostname; } catch (_) {}
  if (v("website_official") === "true") out.push({ kind: "safe", text: `الموقع ${iso(site || "")} نطاق رسمي لـ${b}.` });
  else if (v("website_official") === "false") out.push({ kind: "risk", text: `الموقع ${iso(site || "")} ليس نطاقا رسميا لـ${b}.` });
  else out.push({ kind: "neutral", text: "لا يحتوي الإعلان على موقع إلكتروني." });

  if (row.review_count !== "" && row.review_count != null && Number(row.review_count) < 5) {
    const rc = Number(row.review_count);
    out.push({ kind: "risk", text: rc === 0 ? "لا توجد تقييمات على الإعلان." : `عدد التقييمات على الإعلان ${rc} فقط.` });
  }
  return out;
}

const lForm = $("l-form"), lDemo = $("l-demo");
let listingRow = null, demoRows = null;
function renderListing(scroll) {
  if (!listingRow) return;
  const card = within(lForm, ".result"), row = listingRow;
  const [word, sub] = t("v.lst." + (LTONE[row.verdict] ? row.verdict : "unverified"));
  verdictBlock(card, LTONE[row.verdict] || "grey", word, sub);
  within(card, ".signals").replaceWith(signalsBox(row));
  fillReasons(within(card, ".reasons"), listingReasons(row));
  card.hidden = false;
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderDemo() {
  if (!demoRows) return;
  const list = $("demo-list"), open = new Set([...list.querySelectorAll(".item.open")].map((el) => el.dataset.i));
  list.innerHTML = "";
  demoRows.forEach((row, i) => {
    const vk = LTONE[row.verdict] ? row.verdict : "unverified";
    const item = document.createElement("div"); item.className = "item" + (open.has(String(i)) ? " open" : ""); item.dataset.i = i;
    const head = document.createElement("button"); head.type = "button"; head.setAttribute("aria-expanded", open.has(String(i)));
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = row.name;
    if (row.synthetic === "true") { const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = t("badge"); nm.append(bd); }
    const chip = document.createElement("span"); chip.className = "chip " + LTONE[vk]; chip.textContent = t("v.lst." + vk)[0];
    const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = t("lst.meta", { p: iso(row.phone), n: row.disagreement_count });
    head.append(nm, chip, meta);
    const det = document.createElement("div"); det.className = "detail";
    const ul = document.createElement("ul"); ul.className = "reasons"; fillReasons(ul, listingReasons(row));
    det.append(signalsBox(row), ul);
    head.addEventListener("click", () => { item.classList.toggle("open"); head.setAttribute("aria-expanded", item.classList.contains("open")); });
    item.append(head, det); list.append(item);
  });
}
$("seg-form").addEventListener("click", () => { $("seg-form").classList.add("on"); $("seg-demo").classList.remove("on"); lForm.hidden = false; lDemo.hidden = true; });
$("seg-demo").addEventListener("click", () => { $("seg-demo").classList.add("on"); $("seg-form").classList.remove("on"); lForm.hidden = true; lDemo.hidden = false; loadDemo(false); });
$("f-listing").addEventListener("submit", async (e) => {
  e.preventDefault();
  listingRow = null; clearOut(lForm); busy(lForm, true);
  try {
    const rev = $("lrev").value.trim();
    listingRow = await (await post("/api/listing", { brand: $("lbrand").value, name: $("lname").value.trim(),
      phone: $("lphone").value.trim(), address: $("laddr").value.trim(), website: $("lsite").value.trim(),
      review_count: rev === "" ? null : Number(rev) })).json();
    renderListing(true);
  } catch (err) { showError(lForm, errText(err)); }
  finally { busy(lForm, false); }
});
async function loadDemo(refresh) {
  if (demoRows && !refresh) return;
  within(lDemo, ".error").classList.remove("on"); within(lDemo, ".spinner").classList.add("on"); $("rescan").disabled = true;
  try {
    const r = await fetch(BASE + "/api/listings" + (refresh ? "?refresh=1" : ""));
    if (!r.ok) { let d = ""; try { d = (await r.json()).detail || ""; } catch (_) {} throw new Error(d || t("err.http", { c: r.status })); }
    demoRows = await r.json(); renderDemo();
  } catch (err) { showError(lDemo, errText(err)); }
  finally { within(lDemo, ".spinner").classList.remove("on"); $("rescan").disabled = false; }
}
$("rescan").addEventListener("click", () => loadDemo(true));

function renderAll() { renderLink(false); renderNumber(false); renderListing(false); renderDemo(); }

(async () => {
  try { const h = await (await fetch(BASE + "/api/health")).json(); health = h.checker_api ? "ok" : "noapi"; }
  catch (_) { health = "down"; }
  showBanner();
  try {
    const brands = await (await fetch(BASE + "/api/brands")).json();
    for (const b of brands) BRANDS[b.brand] = { en: b.display_name, name: b.display_name };
    document.querySelectorAll("select.brands").forEach((sel) => {
      for (const b of brands) { const o = document.createElement("option"); o.value = b.brand; o.textContent = b.display_name; sel.append(o); }
    });
  } catch (_) {}
})();
applyLang();
if (location.hash === "#number") showTab("number");
if (location.hash === "#listing") showTab("listing");
