.hero {position:relative;height:108px;background:rgba(255,255,255,.86); border-bottom:1px solid #e5eff5;padding:16px 20px;box-shadow:0 5px 24px #2e79aa0b;backdrop-filter:blur(14px)}

.hero-name {font-size:24px;letter-spacing:-.8px;font-weight:850;color:#113c5c}

.hero-title {font-size:12.6px;color:#577d99;margin-top:5px;font-weight:650}
.hero .tag {font-size:11.2px;color:#7195aa}
.hero-decor {width:160px;height:160px;right:-108px;top:-94px;border:22px solid #dcf4ff;opacity:.75;animation:decorDrift 10s ease-in-out infinite}
.brand-status {position:absolute;right:18px;top:10px;color:#27799b;font-size:9px;letter-spacing:1.3px;font-weight:900;display:flex;align-items:center;gap:6px}
.brand-status span {width:6px;height:6px;border-radius:50%;background:#31b5a6;box-shadow:0 0 0 4px #36c4b521;animation:statusBreathe 3.5s ease-in-out infinite}

.flag {height:3px;opacity:.9}
.langbar {padding:12px 20px 3px;position:relative;z-index:2}
.langbar button {border-radius:999px;min-height:37px;padding:8px 12px;box-shadow:0 4px 14px #0c427809;background:#fff}
.langbar button:hover {border-color:#b6ddf3;background:#f4fbff}
.langbar #lang {background:#e5f5ff;border-color:#bee4f8;color:#166eab}
main {padding:13px 20px 0}
.panel {display:none;}
.panel.on {display:block;animation:panelEnter .42s cubic-bezier(.2,.8,.2,1) both}
h1 {font-size:27px;line-height:1.17;letter-spacing:-.8px;font-weight:850;color:#153c5a;margin:0 0 12px}
html[dir=rtl] h1 {letter-spacing:0;font-size:26px;line-height:1.35}
.lead {font-size:13.5px;color:#67849a;line-height:1.78}
.welcome-row {display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;margin-bottom:9px}
.eyebrow {margin:0;font-size:10.6px;letter-spacing:1.4px;color:#268bb9;font-weight:900;display:flex;align-items:center;gap:8px}
html[dir=rtl] .eyebrow {letter-spacing:0}
.live-dot {width:7px;height:7px;display:inline-block;background:#28b8b6;border-radius:50%;box-shadow:0 0 0 4px #21bcb41d;animation:statusBreathe 3.2s ease-in-out infinite;flex:none}
.ready-tag {flex:none;display:flex;align-items:center;gap:5px;border-radius:999px;background:#fff;border:1px solid #e0edf5;padding:5px 8px;color:#628197;font-size:9px;font-weight:700}
.ready-check {background:#dcf9eb;color:#139c6c;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.home-lead {font-size:14px;line-height:1.7;max-width:39ch;margin:0 0 17px}
.spotlight {position:relative;overflow:hidden;border-radius:25px;padding:22px 20px 17px;background:linear-gradient(115deg,#d8f3ff 0%,#eaf3ff 59%,#f6f6ff 100%);border:1px solid #cce8f9;box-shadow:0 12px 28px #2f83b319;margin-bottom:24px;isolation:isolate;animation:riseIn .65s ease both}
.spotlight::after {content:"";position:absolute;top:-90px;right:-65px;width:280px;height:280px;background:radial-gradient(circle,#c4e8ff99 0%,transparent 67%);pointer-events:none;z-index:-1}
.spotlight-glow {position:absolute;width:210px;height:210px;right:-80px;bottom:-120px;border:1px solid #badcf5;border-radius:50%;box-shadow:0 0 0 32px #d0eafe55,0 0 0 65px #e6f5ff70;animation:decorDrift 11s ease-in-out infinite;pointer-events:none}
.spotlight-top {display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:144px}
.spotlight-copy {max-width:225px;position:relative;z-index:1}
.spotlight-eyebrow {display:block;font-size:10px;letter-spacing:1px;font-weight:850;color:#2685b6;margin-bottom:8px}
html[dir=rtl] .spotlight-eyebrow {letter-spacing:0}
.spotlight-title {font-size:20px;line-height:1.23;color:#15486a;font-weight:850;margin:0 0 9px;padding:0;border:0;letter-spacing:-.3px}
html[dir=rtl] .spotlight-title {letter-spacing:0;font-size:19px}
.spotlight-desc {font-size:11.5px;color:#537c95;line-height:1.55;margin:0}
.shield-scanner {width:110px;height:128px;flex:0 0 110px;position:relative;display:grid;place-items:center;animation:shieldFloat 5s ease-in-out infinite}
.shield-art {position:relative;z-index:2;width:74px;height:82px;filter:drop-shadow(0 7px 12px #117aaf31)}
.scan-orbit {position:absolute;inset:13px 4px;border:1px solid #6acbea7a;border-radius:50%;transform:rotate(-21deg)}
.orbit-a {animation:orbitBreathe 4s ease-in-out infinite}
.orbit-b {inset:27px -5px;border-color:#9ed5fd94;transform:rotate(27deg);animation:orbitBreathe 6s ease-in-out infinite reverse}
.scan-sweep {position:absolute;top:23px;left:23px;right:23px;height:3px;border-radius:99px;z-index:3;background:linear-gradient(90deg,transparent,#23a9c4,transparent);box-shadow:0 0 13px #22abd6;animation:scanLine 3.5s ease-in-out infinite}
.sparkle {position:absolute;color:#51b7dc;font-size:15px;z-index:3;animation:sparkleTwinkle 3.3s ease-in-out infinite}.sp-one{left:3px;top:9px}.sp-two{right:1px;bottom:10px;animation-delay:1.4s}
.spotlight-cta {display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;width:100%;background:linear-gradient(105deg,#0c78b2,#1665c4);box-shadow:0 10px 22px #156bae2a;border-radius:15px;color:#fff;font-size:13.5px;font-weight:800;position:relative;z-index:3;transition:transform .18s ease,box-shadow .18s ease}
.spotlight-cta:hover {transform:translateY(-2px);box-shadow:0 12px 26px #156bae3b}
.cta-arrow {margin-inline-start:auto;font-size:20px;font-weight:400;line-height:1}
html[dir=rtl] .cta-arrow {transform:scaleX(-1)}
.services-top {display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px}
.section-heading {font-size:17px;color:#133e5e;font-weight:850;margin:0;padding:0;border:0}
.services-top>span {font-size:10.5px;color:#829aaa;text-align:end;white-space:nowrap}
.action-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.action-tile {min-height:153px;border-radius:20px;border:1px solid #deebf4;background:rgba(255,255,255,.94);box-shadow:0 6px 18px #2752790b;padding:16px;isolation:isolate;animation:riseIn .6s ease both;animation-delay:var(--tile-delay,0s);transition:transform .23s cubic-bezier(.2,.8,.2,1),box-shadow .23s ease,border-color .23s ease}
.action-tile::after {content:"";position:absolute;width:70px;height:70px;right:-32px;top:-30px;border-radius:50%;background:#e9f6ff70;z-index:-1;transition:transform .3s ease}
.action-tile:hover {transform:translateY(-5px);box-shadow:0 13px 23px #20558220;border-color:#b9dff3;background:#fff}
.action-tile:hover::after {transform:scale(1.5)}
.action-tile:active {transform:scale(.975)}
.tile-icon {width:44px;height:44px;box-shadow:0 6px 13px #0a57810b;transition:transform .22s ease}
.action-tile:hover .tile-icon {transform:rotate(-7deg) scale(1.07)}
.action-tile strong {font-size:13.8px;line-height:1.3;color:#183e5b}
.action-tile small {font-size:11.2px;line-height:1.52;color:#70889b}
.tile-go {bottom:13px;color:#529fc2;transition:transform .2s ease}
.action-tile:hover .tile-go {transform:translate(2px,-2px)}
html[dir=rtl] .action-tile:hover .tile-go {transform:translate(-2px,-2px)}
.how-it-works {margin:24px 0 0;background:#ffffffa8;border:1px solid #e2ecf5;border-radius:20px;padding:17px 16px;box-shadow:0 5px 18px #2150780c}
.how-heading {display:flex;gap:8px;align-items:center;color:#174967;font-size:14px}
.mini-stars {font-size:22px;color:#2689c8;animation:sparkleTwinkle 3s ease-in-out infinite}
.steps-row {display:flex;gap:5px;align-items:center;justify-content:space-around;margin-top:15px}
.step {display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:88px;color:#557b94;font-size:10.5px;font-weight:650}
.step-number {width:30px;height:30px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#e6f7ff,#d8eeff);color:#176ea7;font-size:13px;font-weight:900;border:1px solid #d0e9f7}
.step-line {height:1px;flex:1;max-width:48px;background:repeating-linear-gradient(90deg,#a9d8f3 0 5px,transparent 5px 9px);margin-top:-19px}
.tip-card {margin-top:16px;border-radius:18px;background:#fff;border:1px solid #dfeaf2;box-shadow:0 5px 14px #2050780b;padding:16px}
.tip-card-title strong {font-size:13.6px}
.tip-card p {font-size:12px;line-height:1.7}
.trust-banner {border-radius:18px;margin:15px 0 4px;background:linear-gradient(115deg,#eaf9f5,#effaff);border-color:#d4ede9;padding:14px 16px}
.trust-icon {background:#d4f3e7;color:#118967}
.trust-banner strong {color:#16635d}
.trust-banner span:not(.trust-icon) {color:#668999}
/* Secondary screens */
.panel:not(#p-home)>h1 {position:relative;margin-top:14px;padding-inline-start:15px}
.panel:not(#p-home)>h1::before {content:"";position:absolute;inset-inline-start:0;top:5px;width:5px;height:26px;border-radius:8px;background:linear-gradient(#42c4d8,#1f82bf)}
.panel:not(#p-home)>.lead {margin-bottom:20px}
#p-link form,#p-number form,#l-form form,#p-message form,#p-report form {background:#fff;border:1px solid #e1ecf5;border-radius:22px;padding:18px;box-shadow:0 7px 22px #25537d0e}
form button[type=submit] {margin-top:5px;box-shadow:0 7px 15px #196ba923}
input,select {border-radius:13px;transition:border-color .2s ease,box-shadow .2s ease;min-height:52px}
input:focus,select:focus {border-color:#3b9dd2;box-shadow:0 0 0 4px #a5e1fc54}
.result {border-radius:22px;box-shadow:0 10px 24px #245b8315;animation:resultIn .5s cubic-bezier(.2,.8,.2,1) both}
.verdict .word {font-size:29px}
.verdict .bar b {transition:width .85s cubic-bezier(.1,.75,.2,1)}
ul.reasons li {border-radius:13px;animation:riseIn .45s ease both}
ul.reasons li:nth-child(2) {animation-delay:.08s}ul.reasons li:nth-child(3){animation-delay:.16s}
.spinner.on {display:flex;background:#e9f6fe;border:1px solid #d7edfc;border-radius:13px;padding:12px 15px;animation:panelEnter .25s ease}
.spinner i {width:22px;height:22px;border-width:3px}
.banner.on {animation:panelEnter .25s ease}
.item {transition:transform .2s ease,box-shadow .2s ease}
.item:hover {transform:translateY(-2px);box-shadow:0 9px 22px #2a65801a}
/* Elevated navigation with large, accessible touch targets */
nav.tabs {background:#fffffff5;backdrop-filter:blur(14px);border-top:1px solid #e5edf5;box-shadow:0 -7px 24px #20578112;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner {max-width:470px;grid-template-columns:repeat(5,1fr);gap:3px;padding:7px 9px 5px}
nav.tabs button {min-height:58px;padding:8px 2px;border-radius:15px;background:transparent;color:#7794aa;box-shadow:none;gap:4px;font-size:11px;font-weight:760}
nav.tabs button.on {background:linear-gradient(180deg,#e7f6ff,#f2faff);box-shadow:none;color:#1177b5}
nav.tabs button svg {width:22px;height:22px;transition:transform .24s cubic-bezier(.2,.9,.2,1)}
nav.tabs button.on svg {transform:translateY(-2px);animation:navPop .33s ease}
nav.tabs button:focus-visible {outline:3px solid #67c5f4;outline-offset:-2px}
footer {padding-bottom:10px;overflow-wrap:anywhere;font-size:10px}
/* Non-blocking feedback overlays and tap ripples */
.toast {z-index:15}
.tap-ripple {position:absolute;border-radius:50%;background:#79d3ff4d;pointer-events:none;transform:scale(0);animation:tapRipple .55s ease-out forwards;z-index:8}
button {position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
button:focus-visible {outline:3px solid #53bff0;outline-offset:2px}
#tipButton {scroll-margin-top:90px}
@keyframes ambientFloat {0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(35px,-45px,0)}}
@keyframes logoFloat {0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes decorDrift {0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-12px,8px,0)}}
@keyframes statusBreathe {0%,100%{box-shadow:0 0 0 3px #33b8a62a}50%{box-shadow:0 0 0 7px #33b8a60a}}
@keyframes riseIn {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes panelEnter {from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes resultIn {from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shieldFloat {0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbitBreathe {0%,100%{opacity:.65;scale:1}50%{opacity:1;scale:1.07}}
@keyframes scanLine {0%,100%{transform:translateY(5px);opacity:.3}48%{transform:translateY(69px);opacity:1}60%{opacity:.7}}
@keyframes sparkleTwinkle {0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}
@keyframes navPop {0%{transform:translateY(1px) scale(.84)}80%{transform:translateY(-3px) scale(1.08)}100%{transform:translateY(-2px) scale(1)}}
@keyframes tapRipple {0%{opacity:.7;transform:scale(0)}100%{opacity:0;transform:scale(1)}}
@media (max-width:360px) {
  .hero .brand-image {width:64px;height:64px}
  .hero-name {font-size:22px}.hero-title {font-size:11px}
  main {padding-inline:15px}.langbar {padding-inline:15px}
  .spotlight {padding:18px 16px}.spotlight-title {font-size:18px}
  .shield-scanner {width:87px;flex-basis:87px}
  .spotlight-copy {max-width:185px}.spotlight-desc {font-size:11px}
  .ready-tag {font-size:8px}.eyebrow {font-size:9px}
  .action-tile {padding:13px;min-height:149px}
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

  if (typeof s === "string") for (const [a, b] of Object.entries(vars)) s = s.replaceAll("{" + a + "}", b);

const qs = new URLSearchParams(location.search);
const BASE = (qs.get("server") || (location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8001")).replace(/\/$/, "");
const $ = (id) => document.getElementById(id);
const within = (el, sel) => el.querySelector(sel);
const CMD_SERVER = "python -m uvicorn hirz_server:app --port 8001", CMD_API = "python -m uvicorn api:app --port 8000";

async function post(path, body) {
  const r = await fetch(BASE + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) {
    let detail = ""; try { detail = (await r.json()).detail || ""; } catch (_) {}
    const e = new Error(detail || t("err.http", { c: r.status })); e.http = true; throw e;
  }
  return r;
}
const errText = (err) => err instanceof TypeError ? t("err.server") + " " + iso(CMD_SERVER) : err.message;
function busy(el, on) { within(el, ".spinner").classList.toggle("on", on); el.querySelectorAll("form button").forEach((b) => (b.disabled = on)); }
function showError(el, msg) { const e = within(el, ".error"); e.textContent = msg; e.classList.add("on"); }
function clearOut(el) { within(el, ".error").classList.remove("on"); within(el, ".result").hidden = true; }
let toastTimer;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2600); }

let health = null;
function showBanner() {
  const b = $("banner"); b.classList.remove("on");
  if (health === "down" && !$("p-home").classList.contains("on")) { b.textContent = t("preview.offline"); b.classList.add("on"); }
  else if (health === "noapi") { b.textContent = t("err.api") + " " + iso(CMD_API); b.classList.add("on"); }
}

function verdictBlock(card, tone, word, sub, score) {
  const v = within(card, ".verdict"); v.className = "verdict v-" + tone;
  within(v, ".word").textContent = word; within(v, ".sub").textContent = sub;
  const sc = within(v, ".score"), bar = within(v, ".bar b");
  if (sc) sc.textContent = Number.isFinite(score) ? t("score", { s: score }) : "";
  if (bar) { bar.style.width = "0"; requestAnimationFrame(() => (bar.style.width = (Number.isFinite(score) ? score : 0) + "%")); }
}
function fillReasons(ul, items) {              // items: [{text, kind: "risk"|"safe"|"neutral"}]
  ul.innerHTML = "";
  if (!items.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = t("noreasons"); ul.append(li); return; }
  for (const it of items) {
    const li = document.createElement("li"); li.className = it.kind;
    const d = document.createElement("span"); d.className = "dot"; d.textContent = it.kind === "safe" ? "✓" : it.kind === "neutral" ? "–" : "!";
    const s = document.createElement("span"); s.textContent = it.text; li.append(d, s); ul.append(li);
  }
}
const apiReasons = (reasons, brand) => (reasons || []).map((r) => ({
  kind: r.direction === "safe" ? "safe" : "risk",
  // the server translates the sentences it composes; the table covers the fixed codes
  text: LANG === "ar"
    ? (r.text_ar || REASON_AR[r.code] || r.text || r.code).replace("{b}", brand || "الجهة")

  for (const p of EV_PANELS) {
    const btn = $(p.btnId), msg = $(p.msgId);

    msg.className = "msg"; msg.textContent = t("ev.hint");

}
function renderLink(scroll) {
  if (!linkData) return;
  const d = linkData;
  const key = d.status === "OFFICIAL" || (d.reasons || []).some((r) => r.code === "official") ? "official"
    : ["malicious", "suspicious", "clean"].includes(d.verdict) ? d.verdict : "unknown";
  const tone = { official: "green", malicious: "red", suspicious: "amber", clean: "blue", unknown: "grey" }[key];
  const [word, sub] = t("v.link." + key);
  const card = within(pLink, ".result");
  verdictBlock(card, tone, word, sub, d.score);
  const host = within(card, ".host"); host.innerHTML = "";
  if (d.host) {
    const b = document.createElement("b"); b.textContent = iso(d.reg_domain || d.host);
    host.append(t("realdomain"), b);
    if (d.reg_domain && d.host !== d.reg_domain) host.append(t("fulladdr", { h: iso(d.host) }));

}
$("f-link").addEventListener("submit", async (e) => {
  e.preventDefault();

  lastUrl = url; linkData = null; clearOut(pLink); resetEvidence(); busy(pLink, true);
  try {
    linkData = await (await post("/api/check", { url })).json();
    if (linkData.verdict === "malicious" || linkData.verdict === "suspicious") $("evidence").classList.add("on");
    if (linkData.verdict === "malicious") $("proceed").classList.add("on");

// The evidence bundle is built around a web address: the PDF carries the
// registration, the certificate and the hosting for one host. So each panel
// supplies the address its result is about -- the link itself, the worst link
// found in a message, the website on a listing -- and a panel with no address
// hides the button rather than offering a report that cannot be built.
const EV_PANELS = [];
function wireEvidence(boxId, btnId, msgId, getUrl) {
  EV_PANELS.push({ boxId, btnId, msgId, getUrl });
  $(btnId).addEventListener("click", async () => {
    const btn = $(btnId), msg = $(msgId), url = getUrl();
    if (!url) return;
    evBusy = true; btn.disabled = true; btn.textContent = t("ev.building");
    msg.className = "msg"; msg.textContent = t("ev.collecting");
    try {
      const r = await post("/api/evidence", { url });
      const blob = await r.blob(), id = r.headers.get("X-Evidence-Id") || "report";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "hirz-evidence-" + id + ".pdf";
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      btn.textContent = t("ev.done");
      const h = r.headers.get("X-Bundle-SHA256") || "";
      msg.textContent = t("ev.saved", { f: iso(a.download) }) + (h ? t("ev.hash", { h: iso(h.slice(0, 16)) }) : "");
    } catch (err) { btn.textContent = t("ev.btn"); msg.className = "msg err"; msg.textContent = errText(err); }
    finally { btn.disabled = false; evBusy = false; }
  });
}

function evShow(boxId, on) { $(boxId).classList.toggle("on", !!on); }
$("proceedBtn").addEventListener("click", () => $("warn").classList.add("on"));
$("openBtn").addEventListener("click", () => window.open(/^https?:\/\//i.test(lastUrl) ? lastUrl : "https://" + lastUrl, "_blank", "noopener,noreferrer"));

// ---------- NUMBER
const pNum = $("p-number");
let numData = null, numBrand = "";
function renderNumber(scroll) {
  if (!numData) return;
  const d = numData, reasons = d.reasons || [];
  const key = reasons.some((r) => r.code === "official") ? "official"
    : ["malicious", "suspicious", "clean"].includes(d.verdict) ? d.verdict : "unknown";
  const tone = { official: "green", malicious: "red", suspicious: "amber", clean: "blue", unknown: "grey" }[key];
  const [word, sub] = t("v.num." + key);
  const card = within(pNum, ".result");
  verdictBlock(card, tone, word, sub, d.score);
  const host = within(card, ".host"); host.innerHTML = "";
  if (d.number) { const b = document.createElement("b"); b.textContent = iso(d.number); host.append(t("num.number"), b); }
  fillReasons(within(card, ".reasons"), apiReasons(reasons, brandName(numBrand)));
  card.hidden = false;
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
$("f-number").addEventListener("submit", async (e) => {
  e.preventDefault();
  const number = $("number").value.trim(); if (!number) return;
  numBrand = $("nbrand").value;
  const ctx = numBrand ? (BRANDS[numBrand] && BRANDS[numBrand].en) || numBrand : null;
  numData = null; clearOut(pNum); busy(pNum, true);
  try { numData = await (await post("/api/check-number", { number, brand_context: ctx })).json(); renderNumber(true); }
  catch (err) { showError(pNum, errText(err)); }
  finally { busy(pNum, false); }
});

// ---------- LISTING
const LTONE = { fabricated: "red", suspicious: "amber", genuine: "green", unverified: "grey" };
const SIGNALS = ["phone_in_official", "address_in_branches", "found_in_osm", "web_mentions", "website_official"];
const sigVal = (row, k) => k === "web_mentions"
  ? (row[k] === "" || row[k] == null ? "" : Number(row[k]) >= 2 ? "true" : "false") : String(row[k] ?? "");

function signalsBox(row) {
  const box = document.createElement("div"); box.className = "signals";
  for (const k of SIGNALS) {
    const v = sigVal(row, k), line = document.createElement("div"), d = document.createElement("span");
    d.className = "dot " + (v === "true" ? "yes" : v === "false" ? "no" : "na");
    d.textContent = v === "true" ? "✓" : v === "false" ? "✗" : "–";
    const s = document.createElement("span"); s.textContent = t("sig." + k);
    const sm = document.createElement("small"); sm.textContent = t(v === "true" ? "sig.yes" : v === "false" ? "sig.no" : "sig.na");
    line.append(d, s, sm); box.append(line);
  }
  return box;
}
// English: the scanner's own sentences. Arabic: built from the same check results.
function listingReasons(row) {
  if (LANG !== "ar") {
    const rs = Array.isArray(row.reasons) ? row.reasons : String(row.reasons || "").split(" | ").filter(Boolean);
    return rs.map((text) => {
      const neutral = /not checked|could not be checked|neither confirm|no official branch list|has no website/i.test(text);
      const good = /published helpline|matches|is an official|shows a .* location|consistent with|appear on \d+ other/i.test(text);
      return { text, kind: good ? "safe" : neutral ? "neutral" : "risk" };
    });
  }
  const b = brandName(row.brand) || "الجهة", n = Number(row.disagreement_count || 0), out = [];
  const v = (k) => sigVal(row, k), phone = iso(row.phone || "");
  const kind = { fabricated: "risk", suspicious: "risk", genuine: "safe", unverified: "neutral" }[row.verdict] || "neutral";
  if (row.verdict === "fabricated") out.push({ kind, text: row.phone_verdict === "malicious"
      ? `مزيف بشكل قاطع: ${b} لا تنشر رقم هاتف متحرك شخصي كرقم لخدمة العملاء.`
      : `مزيف بشكل قاطع: ${n} من الفحوصات المستقلة تتعارض مع المعلومات الرسمية لـ${b}.` });
  else if (row.verdict === "genuine" && v("found_in_osm") === "false") out.push({ kind,
      text: `رقم الهاتف هو الرقم المنشور لـ${b}. الإعلان غير موجود على OpenStreetMap، لكن تغطية الخرائط في الإمارات غير مكتملة، لذا لا يعد ذلك وحده مؤشرا تحذيريا.` });
  else if (row.verdict === "genuine") out.push({ kind, text: `يتوافق مع المعلومات الرسمية لـ${b} في جميع الفحوصات التي أجريت.` });
  else if (row.verdict === "suspicious") out.push({ kind, text: `${n} من الفحوصات تتعارض مع المعلومات الرسمية لـ${b}. اتصل بالرقم المنشور على موقع ${b} الرسمي بدلا من ذلك.` });
  else out.push({ kind, text: "لا شيء يناقض هذا الإعلان، لكن لم يمكن التحقق من تفاصيل كافية لتأكيده." });

  if (!row.phone) out.push({ kind: "neutral", text: "لا يظهر رقم هاتف في الإعلان." });
  else if (v("phone_in_official") === "true") out.push({ kind: "safe", text: `رقم الهاتف ${phone} هو رقم خدمة العملاء المنشور لـ${b}.` });
  else out.push({ kind: "risk", text: `رقم الهاتف ${phone} ليس من الأرقام المنشورة لـ${b}` + (row.phone_verdict === "malicious" ? " (رقم هاتف متحرك شخصي)." : ".") });

  if (v("address_in_branches") === "true") out.push({ kind: "safe", text: `العنوان يطابق الفرع الرسمي «${row.matched_branch}» لـ${b}.` });
  else if (v("address_in_branches") === "false") out.push({ kind: "risk", text: `العنوان لا يطابق أي فرع في قائمة الفروع الرسمية لـ${b}.` });
  else out.push({ kind: "neutral", text: `لا توجد قائمة فروع رسمية لـ${b} حتى الآن، لذا لم يفحص العنوان.` });

  if (v("found_in_osm") === "true") out.push({ kind: "safe", text: `يظهر على OpenStreetMap موقع لـ${b} في هذا العنوان.` });
  else if (v("found_in_osm") === "false") out.push({ kind: "risk", text: `يعرض OpenStreetMap مواقع لـ${b}، لكن ليس في هذا العنوان.` });
  else out.push({ kind: "neutral", text: "لا يمكن لـOpenStreetMap تأكيد هذا الإعلان أو نفيه." });

  if (row.web_mentions === "" || row.web_mentions == null) out.push({ kind: "neutral", text: "لم يفحص الحضور على الإنترنت (لا يوجد مفتاح بحث)." });
  else if (Number(row.web_mentions) >= 2) out.push({ kind: "safe", text: `الاسم والرقم يظهران في ${row.web_mentions} مواقع أخرى.` });
  else out.push({ kind: "risk", text: `الاسم والرقم لا يكادان يظهران في أي موقع آخر (${row.web_mentions})، وهذا مؤشر على إعلان مختلق.` });

  let site = row.website || ""; try { if (site) site = new URL(/^https?:/i.test(site) ? site : "https://" + site).hostname; } catch (_) {}
  if (v("website_official") === "true") out.push({ kind: "safe", text: `الموقع ${iso(site || "")} نطاق رسمي لـ${b}.` });
  else if (v("website_official") === "false") out.push({ kind: "risk", text: `الموقع ${iso(site || "")} ليس نطاقا رسميا لـ${b}.` });
  else out.push({ kind: "neutral", text: "لا يحتوي الإعلان على موقع إلكتروني." });

  if (row.review_count !== "" && row.review_count != null && Number(row.review_count) < 5) {
    const rc = Number(row.review_count);
    out.push({ kind: "risk", text: rc === 0 ? "لا توجد تقييمات على الإعلان." : `عدد التقييمات على الإعلان ${rc} فقط.` });
  }
  return out;
}

const lForm = $("l-form"), lDemo = $("l-demo");
let listingRow = null, demoRows = null;
function renderListing(scroll) {
  if (!listingRow) return;
  const card = within(lForm, ".result"), row = listingRow;
  const [word, sub] = t("v.lst." + (LTONE[row.verdict] ? row.verdict : "unverified"));
  verdictBlock(card, LTONE[row.verdict] || "grey", word, sub);
  within(card, ".signals").replaceWith(signalsBox(row));
  fillReasons(within(card, ".reasons"), listingReasons(row));
  evShow("l-evidence", row.website);
  card.hidden = false;
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
wireEvidence("l-evidence", "lEvBtn", "lEvMsg", () => (listingRow && listingRow.website) || "");
$("lstReport").addEventListener("click", () => {
  const r = listingRow || {};
  prefillReport("listing", r.website || r.phone || "",
    [r.name, r.address, r.phone].filter(Boolean).join(" \u00b7 "));
});

function renderDemo() {
  if (!demoRows) return;
  const list = $("demo-list"), open = new Set([...list.querySelectorAll(".item.open")].map((el) => el.dataset.i));
  list.innerHTML = "";
  demoRows.forEach((row, i) => {
    const vk = LTONE[row.verdict] ? row.verdict : "unverified";
    const item = document.createElement("div"); item.className = "item" + (open.has(String(i)) ? " open" : ""); item.dataset.i = i;
    const head = document.createElement("button"); head.type = "button"; head.setAttribute("aria-expanded", open.has(String(i)));
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = row.name;
    if (row.synthetic === "true") { const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = t("badge"); nm.append(bd); }
    const chip = document.createElement("span"); chip.className = "chip " + LTONE[vk]; chip.textContent = t("v.lst." + vk)[0];
    const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = t("lst.meta", { p: iso(row.phone), n: row.disagreement_count });
    head.append(nm, chip, meta);
    const det = document.createElement("div"); det.className = "detail";
    const ul = document.createElement("ul"); ul.className = "reasons"; fillReasons(ul, listingReasons(row));
    det.append(signalsBox(row), ul);
    head.addEventListener("click", () => { item.classList.toggle("open"); head.setAttribute("aria-expanded", item.classList.contains("open")); });
    item.append(head, det); list.append(item);
  });
}
$("seg-form").addEventListener("click", () => { $("seg-form").classList.add("on"); $("seg-demo").classList.remove("on"); lForm.hidden = false; lDemo.hidden = true; });
$("seg-demo").addEventListener("click", () => { $("seg-demo").classList.add("on"); $("seg-form").classList.remove("on"); lForm.hidden = true; lDemo.hidden = false; loadDemo(false); });
$("f-listing").addEventListener("submit", async (e) => {
  e.preventDefault();
  listingRow = null; clearOut(lForm); busy(lForm, true);
  try {
    const rev = $("lrev").value.trim();
    listingRow = await (await post("/api/listing", { brand: $("lbrand").value, name: $("lname").value.trim(),
      phone: $("lphone").value.trim(), address: $("laddr").value.trim(), website: $("lsite").value.trim(),
      review_count: rev === "" ? null : Number(rev) })).json();
    renderListing(true);
  } catch (err) { showError(lForm, errText(err)); }
  finally { busy(lForm, false); }
});
async function loadDemo(refresh) {
  if (demoRows && !refresh) return;
  within(lDemo, ".error").classList.remove("on"); within(lDemo, ".spinner").classList.add("on"); $("rescan").disabled = true;
  try {
    const r = await fetch(BASE + "/api/listings" + (refresh ? "?refresh=1" : ""));
    if (!r.ok) { let d = ""; try { d = (await r.json()).detail || ""; } catch (_) {} throw new Error(d || t("err.http", { c: r.status })); }
    demoRows = await r.json(); renderDemo();
  } catch (err) { showError(lDemo, errText(err)); }
  finally { within(lDemo, ".spinner").classList.remove("on"); $("rescan").disabled = false; }
}
$("rescan").addEventListener("click", () => loadDemo(true));


// ---------- MESSAGE
const pMsg = $("p-message");
let msgData = null;
const MTONE = { high: "red", medium: "amber", low: "blue", unknown: "grey" };

function itemRow(head, lines) {
  const d = document.createElement("div"); d.className = "signals";
  const h = document.createElement("b"); h.textContent = head; h.style.display = "block"; h.dir = "ltr";
  d.append(h);
  for (const ln of lines) { const s = document.createElement("small"); s.style.display = "block"; s.textContent = ln; d.append(s); }
  return d;
}
function renderMsg(scroll) {
  if (!msgData) return;
  const d = msgData, card = within(pMsg, ".result");
  const key = ["high", "medium", "low"].includes(d.risk_level) ? d.risk_level : "unknown";
  const [word, sub] = t("v.msg." + key);
  verdictBlock(card, MTONE[key], word, sub, NaN);
  const c = d.counts;
  within(card, ".host").textContent = c
    ? t("msg.found", { l: c.urls, n: c.phones, e: c.emails }) : (d.summary || "");
  const indText = (i) => LANG === "ar" && i.reason_code && REASON_AR[i.reason_code]
    ? (i.subject ? i.subject + ": " : "") + REASON_AR[i.reason_code] : i.description;
  fillReasons(within(card, ".reasons"),
    (d.indicators || []).map((i) => ({ kind: "risk", text: indText(i) })));

  const box = $("m-items"); box.innerHTML = "";
  const lines = (it) => (it.reasons || []).map((text, k) => {
    const code = (it.reason_codes || [])[k];
    return LANG === "ar" && code && REASON_AR[code] ? REASON_AR[code] : text;
  });
  if ((d.urls || []).length) {
    const h = document.createElement("h2"); h.textContent = t("msg.urls"); box.append(h);
    for (const u of d.urls) box.append(itemRow(iso(u.url) + "  —  " + (u.status || "") + " " + (u.score ?? "") + "/100", lines(u)));
  }
  if ((d.phone_numbers || []).length) {
    const h = document.createElement("h2"); h.textContent = t("msg.phones"); box.append(h);
    for (const n of d.phone_numbers) box.append(itemRow(iso(n.number) + "  —  " + (n.verdict || ""), lines(n)));
  }
  if ((d.email_addresses || []).length) {
    const h = document.createElement("h2"); h.textContent = t("msg.emails"); box.append(h);
    box.append(itemRow(d.email_addresses.map(iso).join("  ·  "), []));
  }
  fillReasons(within(card, ".recs"), (d.recommendations || []).map((r) => ({ kind: "neutral", text: r })));
  evShow("m-evidence", msgWorstUrl());
  card.hidden = false;
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
$("f-message").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("mtext").value.trim(); if (!text) return;
  msgData = null; clearOut(pMsg); busy(pMsg, true);
  try { msgData = await (await post("/api/scan-message", { text, lang: LANG })).json(); renderMsg(true); }
  catch (err) { showError(pMsg, errText(err)); }
  finally { busy(pMsg, false); }
});
// the link worth putting in front of the police is the highest-scoring one
const msgWorstUrl = () => {
  const us = (msgData && msgData.urls) || [];
  if (!us.length) return "";
  return us.reduce((a, b) => ((b.score || 0) > (a.score || 0) ? b : a)).url;
};
wireEvidence("m-evidence", "mEvBtn", "mEvMsg", msgWorstUrl);

$("mReport").addEventListener("click", () => {
  const u = ((msgData && (msgData.urls || [])[0]) || {}).url || "";
  const n = ((msgData && (msgData.phone_numbers || [])[0]) || {}).number || "";
  prefillReport(u ? "website" : n ? "phone" : "other", u || n, $("mtext").value.trim());
});

// ---------- REPORT
const pRep = $("p-report");
let repData = null;
function prefillReport(type, ident, what) {
  $("f-report").hidden = false;
  $("rtype").value = type; $("rident").value = ident || ""; $("rwhat").value = what || "";
  repData = null; clearOut(pRep); showTab("report");
}
function identFields(v) {
  const x = (v || "").trim();
  if (!x) return {};
  if (x.includes("@") && !/^https?:/i.test(x)) return { email: x };
  if (/^[+()\d\s-]{6,}$/.test(x)) return { phone: x };
  return { url: x };
}
function renderReport(scroll) {
  if (!repData) return;
  const d = repData, card = within(pRep, ".result");
  verdictBlock(card, "green", t("rep.done"), t("rep.done.sub"), NaN);
  within(card, ".host").textContent = t("rep.id") + ": " + iso(d.report_id || "");
  const items = [];
  if (d.auto_verdict) items.push({ kind: "risk", text: d.auto_verdict + (d.auto_score !== "" && d.auto_score != null ? " · " + d.auto_score + "/100" : "") });
  if (d.message) items.push({ kind: "neutral", text: d.message });
  fillReasons(within(card, ".reasons"), items);
  card.hidden = false;
  if (scroll) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
$("f-report").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ident = identFields($("rident").value), what = $("rwhat").value.trim();
  if (!Object.keys(ident).length && !what) { showError(pRep, t("rep.err.empty")); return; }
  repData = null; clearOut(pRep); busy(pRep, true);
  try {
    repData = await (await post("/api/report", {
      type: $("rtype").value, description: what,
      reporter: $("rwho").value.trim() || "anonymous", ...ident,
    })).json();
    $("f-report").hidden = true; renderReport(true); toast(t("rep.done"));
  } catch (err) { showError(pRep, errText(err)); }
  finally { busy(pRep, false); }
});
$("rAgain").addEventListener("click", () => {
  $("f-report").reset(); $("f-report").hidden = false; repData = null; clearOut(pRep); window.scrollTo({ top: 0 });
});
$("lReport").addEventListener("click", () => prefillReport("website", lastUrl, ""));

function renderAll() { renderLink(false); renderNumber(false); renderListing(false); renderDemo(); renderMsg(false); renderReport(false); }

// ---------- start
(async () => {
  try { const h = await (await fetch(BASE + "/api/health")).json(); health = h.checker_api ? "ok" : "noapi"; }
  catch (_) { health = "down"; }
  showBanner();
  try {
    const brands = await (await fetch(BASE + "/api/brands")).json();
    for (const b of brands) BRANDS[b.brand] = { en: b.display_name, name: b.display_name };
    document.querySelectorAll("select.brands").forEach((sel) => {
      for (const b of brands) { const o = document.createElement("option"); o.value = b.brand; o.textContent = b.display_name; sel.append(o); }
    });
  } catch (_) {}
})();
applyLang();
if (location.hash === "#number") showTab("number");
if (location.hash === "#listing") showTab("listing");


// Progressive micro-interactions: real buttons retain original actions.
(function enableMicroInteractions() {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  document.addEventListener('pointerdown', (event) => {
    if (reduceMotion.matches) return;
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    const rect = button.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'tap-ripple';
    const size = Math.max(rect.width, rect.height) * 1.6;
    ripple.style.width = ripple.style.height = `${size}px`;
    ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
    ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
    button.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
  });
  // Periodic status updates are visual only; never imply an actual backend check.
  document.querySelectorAll('.action-tile').forEach((tile, index) => {
    tile.style.setProperty('--tile-delay', `${0.10 + index * 0.07}s`);
  });
})();
