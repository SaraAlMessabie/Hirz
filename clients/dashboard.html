<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Detection — Investigator Console</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#15181d;--dim:#6b7280;
        --red:#c7312b;--amber:#b4740b;--green:#1d7a46;--blue:#1f4fd8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;font-weight:650}
  header span{color:var(--dim);font-size:12.5px}
  .proto{background:#fff4e5;color:#92500a;border:1px solid #f3d9b0;
         padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  main{max-width:1240px;margin:0 auto;padding:22px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
         gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .stat .n{font-size:25px;font-weight:650;letter-spacing:-.5px}
  .stat .l{color:var(--dim);font-size:12px;margin-top:2px}
  .stat.hero{border-color:#c9d6f5;background:#f4f7ff}
  .stat.hero .n{color:var(--blue)}
  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);
                      border-radius:7px;background:#fff}
  button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}
  button.ghost{background:#fff;color:var(--ink)}
  button.ok{background:var(--green);border-color:var(--green)}
  button.no{background:#fff;color:var(--red);border-color:#e7bbb9}
  .wrap{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel h2{margin:0;padding:11px 15px;font-size:12px;font-weight:650;
            border-bottom:1px solid var(--line);color:var(--dim);
            text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 13px;text-align:start;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
  tbody tr{cursor:pointer} tbody tr:hover{background:#f9fafb}
  tbody tr.sel{background:#eef3ff}
  td.dom{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
         max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
  .CONFIRMED,.malicious{background:#fdeaea;color:var(--red)}
  .REPORTED,.SUSPICIOUS,.suspicious{background:#fdf3e2;color:var(--amber)}
  .NO_MATCH,.clean{background:#eef0f3;color:var(--dim)}
  .UNKNOWN{background:#eef0f3;color:var(--dim)}
  .tag{background:#eef0f3;color:var(--dim)}
  .detail{padding:15px}
  .detail .dom{font-family:ui-monospace,monospace;font-size:14px;font-weight:600;
               word-break:break-all;margin-bottom:9px}
  .reason{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .reason:last-child{border:0}
  .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px}
  .risk .dot{background:var(--red)} .safe .dot{background:var(--green)}
  .neutral .dot{background:var(--dim)}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;
      border-bottom:1px dashed var(--line)}
  .kv span:first-child{color:var(--dim)}
  .takedown a{display:block;padding:6px 0;color:var(--blue);text-decoration:none;font-size:13px}
  .muted{color:var(--dim);padding:18px 15px;font-size:13px}
  td.link{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
  button.pdf{background:var(--blue);border-color:var(--blue);color:#fff;margin-inline-end:6px}
  button.pdf:disabled{opacity:.65}
  #repmsg{padding-inline:15px}
  .advisory{color:var(--dim);font-size:11.5px;padding:10px 15px 0;font-style:italic}
  /* Arabic: the layout mirrors, but domains, scores and hashes stay left-to-right */
  html[dir=rtl] body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
  html[dir=rtl] .advisory{font-style:normal}
  td.dom,.detail .dom,code,.kv span:last-child{direction:ltr;unicode-bidi:isolate}
  #lang{margin-inline-start:auto;background:#fff;color:var(--ink);font-size:12.5px}
  header{align-items:center}
</style>
</head>
<body>

<header>
  <h1 data-t="title"></h1>
  <span class="proto" data-t="proto"></span>
  <span id="updated"></span>
  <button id="lang" type="button"></button>
</header>

<main>
  <div id="banner" style="display:none;background:#fdeaea;border:1px solid #f0c4c2;
       color:#8a2420;border-radius:9px;padding:11px 14px;margin-bottom:14px;
       font-size:13px"></div>
  <div class="stats" id="stats"></div>

  <div class="bar">
    <input id="brand" data-t-ph="f.brand" style="width:170px">
    <select id="source">
      <option value="" data-t="f.src.all"></option>
      <option value="certificate_transparency" data-t="f.src.ct"></option>
      <option value="permutation_sweep" data-t="f.src.perm"></option>
    </select>
    <select id="minscore">
      <option value="0" data-t="f.score.any"></option><option value="50">50+</option>
      <option value="80" selected>80+</option><option value="95">95+</option>
    </select>
    <button onclick="loadDetections()" data-t="f.apply"></button>
    <button class="ghost" onclick="loadAll()" data-t="f.refresh"></button>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <h2><span data-t="rep.title"></span> <span id="repcount" style="font-weight:400"></span>
      <select id="repfilter" style="float:right;font-weight:400;width:150px">
        <option value="pending" data-t="rep.pending"></option>
        <option value="" data-t="rep.all"></option>
        <option value="confirmed" data-t="rep.confirmed"></option>
        <option value="rejected" data-t="rep.rejected"></option>
      </select></h2>
    <table>
      <thead><tr><th data-t="rep.th.ref"></th><th data-t="rep.th.type"></th><th data-t="rep.th.what"></th>
                 <th data-t="rep.th.check"></th><th data-t="rep.th.by"></th><th data-t="rep.th.when"></th>
                 <th data-t="rep.th.status"></th><th></th></tr></thead>
      <tbody id="reprows"><tr><td colspan="8" class="muted" data-t="loading"></td></tr></tbody>
    </table>
    <div id="repmsg" class="muted" style="padding:6px 0"></div>
  </div>

  <div class="wrap">
    <div class="panel">
      <h2><span data-t="det.title"></span> <span id="count" style="font-weight:400"></span></h2>
      <table>
        <thead><tr><th data-t="det.th.domain"></th><th data-t="det.th.brand"></th><th data-t="det.th.score"></th>
                   <th data-t="det.th.status"></th><th data-t="det.th.source"></th><th data-t="det.th.first"></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted" data-t="loading"></td></tr></tbody>
      </table>
    </div>

    <div class="panel">
      <h2><span data-t="case.title"></span> <span class="muted" style="padding:0;font-weight:400;text-transform:none;letter-spacing:0" data-t="case.hint"></span></h2>
      <div id="detail" class="muted" data-t="case.empty"></div>
    </div>
  </div>
</main>

// answers under /api, so reach back to api.py on its own port. ?api=<url>

  mobile_prefix: "رقم هاتف متحرك شخصي، بينما تنشر البنوك وشركات الشحن والجهات الحكومية في الإمارات أرقاما مجانية أو أرضية",
  line_type: "رقم مجاني أو أرضي، وهذا يتوافق مع أرقام خدمة العملاء الحقيقية",
  not_in_official_set: "ليس من الأرقام المنشورة رسميا لـ{b}", unparseable: "ليس رقم هاتف صالحا",
};

let LANG = "en";
try { LANG = localStorage.getItem("hirz.lang") || (navigator.language || "").startsWith("ar") && "ar" || "en"; } catch (_) {}
function d(k, vars = {}) {
  let v = (D[LANG] && D[LANG][k]) ?? D.en[k] ?? k;
  for (const [a, b] of Object.entries(vars)) v = String(v).replaceAll("{" + a + "}", b);
  return v;
}
// a reason arrives as a code plus English text; Arabic renders from the code
const word = (pfx, k) => (k && D[LANG] && D[LANG][pfx + k]) || k || "";
const statusWord = (k) => word("rep.", k);
const reasonText = (r) => LANG === "ar"
  ? (r.text_ar || REASON_AR[r.code] || r.text || r.code || "")
  : (r.text || r.code || "");
function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = d("title");
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = d(el.dataset.t)));
  document.querySelectorAll("[data-t-ph]").forEach((el) => (el.placeholder = d(el.dataset.tPh)));
  const lb = document.getElementById("lang");
  lb.textContent = d("lang"); lb.setAttribute("aria-label", d("lang.aria"));
  loadAll();
}
document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "ar" ? "en" : "ar";
  try { localStorage.setItem("hirz.lang", LANG); } catch (_) {}
  applyLang();
});

let rows = [], current = null;

// Nothing from the API is trusted markup: domains come from CT logs, report text
// comes from whoever filed the report. Escape before it touches innerHTML.
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function banner(msg){
  const b = document.getElementById("banner");
  if (!b) return;
  if (!msg){ b.style.display = "none"; return; }
  b.style.display = "block"; b.innerHTML = msg;
}

async function getJSON(path){
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(path.split("?")[0] + " returned " + r.status);
  const j = await r.json();
  if (j && j.detail === "Not Found")
    throw new Error(path.split("?")[0] + " does not exist on this server");
  return j;
}

async function loadStats(){
  let s, r;
  try{
    s = await getJSON("/stats");
    r = await getJSON("/api");          // "/" now serves the console, not JSON
  }catch(e){
    banner(d("err.build", { m: esc(e.message) }));
    return;
  }
  banner("");
  document.getElementById("stats").innerHTML = `
    <div class="stat hero"><div class="n">${esc(s.unknown_to_public_feeds)}</div>
      <div class="l">${d("st.unknown")}</div></div>
    <div class="stat"><div class="n">${esc(s.ct_discoveries)}</div>
      <div class="l">${d("st.ct")}</div></div>
    <div class="stat"><div class="n">${esc(s.permutation_recent)}</div>
      <div class="l">${d("st.perm")}</div></div>
    <div class="stat"><div class="n">${esc(s.permutation_with_mx)}</div>
      <div class="l">${d("st.mx")}</div></div>
    <div class="stat"><div class="n">${esc(r.confirmed ?? 0)}</div>
      <div class="l">${d("st.confirmed")}</div></div>
    <div class="stat"><div class="n">${esc(r.official ?? 0)}</div>
      <div class="l">${d("st.official")}</div></div>`;
  document.getElementById("updated").textContent =
    d("updated", { t: new Date().toLocaleTimeString(LANG === "ar" ? "ar-AE" : "en-GB") });
}

async function loadDetections(){
  const p = new URLSearchParams({limit:150,
    min_score: document.getElementById("minscore").value});
  const b = document.getElementById("brand").value.trim();
  const s = document.getElementById("source").value;
  if (b) p.set("brand", b);
  if (s) p.set("source", s);

  let res;                                   // not `d`: that is the translator
  try{
    res = await getJSON("/detections?" + p);
  }catch(e){
    document.getElementById("rows").innerHTML =
      `<tr><td colspan="6" class="muted">${esc(e.message)}</td></tr>`;
    return;
  }
  rows = res.items || [];
  document.getElementById("count").textContent = d("det.showing", { a: res.showing, b: res.total });
  document.getElementById("rows").innerHTML = rows.length ? rows.map((r,i) => `
    <tr onclick="pick(${i})" id="r${i}">
      <td class="dom" title="${esc(r.domain)}">${esc(r.domain)}</td>
      <td>${esc(r.brand || "—")}</td><td><b>${Math.round(r.score)}</b></td>
      <td><span class="pill REPORTED">${d("pill.reported")}</span></td>
      <td><span class="pill tag">${d(r.source === "certificate_transparency" ? "tag.ct" : "tag.sweep")}</span></td>
      <td>${esc((r.first_seen||"").slice(0,10) || d("dash"))}</td></tr>`).join("")
    : `<tr><td colspan="6" class="muted">${d("det.none")}</td></tr>`;
}

function pick(i){
  document.querySelectorAll("tbody tr").forEach(t => t.classList.remove("sel"));
  document.getElementById("r"+i)?.classList.add("sel");
  return showCase(rows[i].domain);
}

// Open the case panel for a report in the queue, so a citizen report reaches the
// same analysis, evidence PDF and takedown routing as anything we found ourselves.
// Takes the row index, never the URL: the URL is typed by whoever filed the report
// and has no business being interpolated into an onclick attribute.
function openReport(i){
  const r = reports[i];
  if (!r) return;
  document.querySelectorAll("tbody tr").forEach(t => t.classList.remove("sel"));
  document.getElementById("rep" + i)?.classList.add("sel");
  if (!r.url){
    const el = document.getElementById("detail");
    el.className = "muted"; el.textContent = d("case.nourl"); current = null; return;
  }
  return showCase(r.url);
}

async function showCase(target){
  current = target;
  const el = document.getElementById("detail");
  el.className = "detail";
  el.innerHTML = `<div class="dom">${esc(target)}</div><div class="muted">${d("case.analysing")}</div>`;

  let v;
  try{
    v = await (await fetch(API + "/check", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({url:target, deep:true})})).json();
  }catch(e){
    el.innerHTML = `<div class="dom">${esc(target)}</div>
                    <div class="muted">${d("case.unreach")}</div>`; return;
  }

  const e = v.enrichment || {};
  const age = [0,1,2,3,4,5].map((i) => d("age" + i));
  el.innerHTML = `
    <div class="dom">${esc(v.host)}</div>
    <div style="margin-bottom:13px">
      <span class="pill ${esc(v.status || v.verdict)}">${esc(word("v.", (v.status || v.verdict || "").replace("_", " ")))}</span>
      <span style="color:var(--dim);font-size:12px;margin-inline-start:8px">
        ${d("case.risk", { s: esc(v.score) })}${v.cached ? d("case.cached") : ""}</span>
    </div>

    <h2 style="border:0;padding:0 0 3px;margin:0">${d("why")}</h2>
    ${(v.reasons||[]).map(x =>
      `<div class="reason ${esc(x.direction)}"><div class="dot"></div><div>${esc(reasonText(x))}</div></div>`
    ).join("") || `<div class="muted" style="padding:6px 0">${d("case.noreasons")}</div>`}

    <h2 style="border:0;padding:13px 0 3px;margin:0">${d("ev.h")}</h2>
    <div class="kv"><span>${d("kv.registered")}</span><span>${
      e.age_bucket >= 0 ? age[e.age_bucket] : d("unknown")}</span></div>
    <div class="kv"><span>${d("kv.cert")}</span><span>${
      e.tls_free_ca ? d("cert.free") : (e.tls_has_org ? d("cert.org") : d("dash"))}</span></div>
    <div class="kv"><span>${d("kv.redirects")}</span><span>${esc(e.redirect_count ?? d("dash"))}${
      e.via_shortener ? d("via.shortener") : ""}</span></div>
    <div class="kv"><span>${d("kv.cloaking")}</span><span>${
      e.cloaked ? d("cloak.yes") : (e.cloaked === 0 ? d("cloak.no") : d("dash"))}</span></div>
    <div class="kv"><span>${d("kv.password")}</span><span>${d(e.has_password ? "yes" : "no")}</span></div>
    <div class="kv"><span>${d("kv.form")}</span><span>${d(e.form_cross_domain ? "yes" : "no")}</span></div>

    <h2 style="border:0;padding:13px 0 3px;margin:0">${d("rev.h")}</h2>
    <div style="display:flex;gap:8px;margin:6px 0 4px">
      <button class="ok" onclick="review('confirm')">${d("rev.confirm")}</button>
      <button class="no" onclick="review('reject')">${d("rev.reject")}</button>
      <button class="ghost" onclick="markOfficial()">${d("rev.official")}</button>
    </div>
    <div style="margin:8px 0 2px">
      <button class="ghost" onclick="getEvidence()" id="evbtn"
              style="width:100%">${d("evb.btn")}</button>
    </div>
    <div id="revmsg" class="muted" style="padding:4px 0"></div>

    <h2 style="border:0;padding:13px 0 3px;margin:0">${d("td.h")}</h2>
    <div class="takedown">
      <a href="https://rdap.org/domain/${encodeURIComponent(v.reg_domain || "")}" target="_blank" rel="noopener">${d("td.registrar")}</a>
      <a href="https://abuse.cloudflare.com/" target="_blank" rel="noopener">${d("td.hosting")}</a>
      <a href="https://safebrowsing.google.com/safebrowsing/report_phish/" target="_blank" rel="noopener">${d("td.google")}</a>
    </div>
    <div class="advisory">${d("td.note")}</div>
    <div class="advisory">${esc((LANG === "ar" && v.advisory_ar) || v.advisory || "")}</div>`;
}

async function review(decision){
  if (!current) return;
  const msg = document.getElementById("revmsg");
  msg.textContent = d("rev.saving");
  try{
    const r = await (await fetch(API + "/review", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({domain: current, decision, reviewer: "investigator"})
    })).json();
    msg.textContent = r.ok
      ? d(decision === "confirm" ? "rev.confirmed" : "rev.rejected", { n: r.confirmed })
      : ("error: " + r.error);
    loadStats();
  }catch(e){ msg.textContent = d("rev.unreach"); }
}

async function getEvidence(){
  if (!current) return;
  return buildEvidence(current, document.getElementById("evbtn"),
                       document.getElementById("revmsg"));
}

// Straight from a report row: the reviewer should not have to open the case
// panel first to get the thing they came for.
async function reportEvidence(i, ev){
  if (ev) ev.stopPropagation();
  const r = reports[i];
  if (!r || !r.url) return;
  return buildEvidence(r.url, ev && ev.target, document.getElementById("repmsg"));
}

async function buildEvidence(target, btn, msg){
  const label = btn ? btn.textContent : "";
  if (btn){ btn.textContent = d("evb.building"); btn.disabled = true; }
  msg.textContent = d("evb.collecting");
  try{
    const r = await fetch(API + "/evidence", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({url: target})});
    if (!r.ok){
      let detail = ""; try { detail = (await r.json()).detail || ""; } catch (_) {}
      msg.textContent = r.status === 503 ? d("evb.nomod")
        : (detail || d("evb.failed", { c: r.status }));
      return;
    }
    const id   = r.headers.get("X-Evidence-Id") || "report";
    const hash = r.headers.get("X-Bundle-SHA256") || "";
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hirz-evidence-" + id + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    msg.innerHTML = d("evb.done", { id: "<b>" + esc(id) + "</b>" })
      + (hash ? '<br><span style="font-family:ui-monospace;font-size:11px;direction:ltr;display:inline-block">sha256 '
                + esc(hash.slice(0,32)) + '…</span>' : "");
  }catch(e){ msg.textContent = d("rev.unreach"); }
  finally{ if (btn){ btn.textContent = label; btn.disabled = false; } }
}

async function markOfficial(){
  if (!current) return;
  const org = prompt(d("rev.prompt"), "");
  if (org === null) return;
  const msg = document.getElementById("revmsg");
  msg.textContent = "saving…";
  try{
    const r = await (await fetch(API + "/official", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({domain: current, org,
                            source: "reviewer_verified",
                            added_by: "investigator"})})).json();
    msg.textContent = r.ok ? d("rev.added", { n: r.total }) : d("rev.already");
    loadStats();
  }catch(e){ msg.textContent = d("rev.unreach"); }
}


// ---------- citizen reports queue
let reports = [];
async function loadReports(){
  const tb = document.getElementById("reprows");
  const st = document.getElementById("repfilter").value;
  try{
    const res = await getJSON("/reports" + (st ? "?status=" + encodeURIComponent(st) : ""));
    reports = res.items || [];
    const counts = res.counts || {};
    document.getElementById("repcount").textContent =
      Object.keys(counts).length
        ? "— " + Object.entries(counts).map(([k, v]) => `${v} ${statusWord(k)}`).join(LANG === "ar" ? "، " : ", ")
        : `— ${reports.length}`;
    if (!reports.length){ tb.innerHTML = `<tr><td colspan="8" class="muted">${d("rep.empty")}</td></tr>`; return; }
    tb.innerHTML = reports.map((r, i) => {
      const what = r.url || r.phone || r.email || d("rep.desconly");
      const rid = /^R-[A-Z0-9]{1,16}$/.test(r.report_id || "") ? r.report_id : "";
      const auto = r.auto_verdict
        ? esc(word("v.", r.auto_verdict)) + (r.auto_score !== "" && r.auto_score != null ? " · " + esc(r.auto_score) : "")
        : d("dash");
      const pdf = r.url
        ? `<button class="pdf" onclick="reportEvidence(${i}, event)" title="${esc(r.url)}">${d("rep.pdf")}</button>`
        : "";
      const act = pdf + (r.status === "pending"
        ? `<button class="ghost" onclick="event.stopPropagation();setReport('${rid}','confirmed')">${d("rep.confirmed")}</button>
           <button class="ghost" onclick="event.stopPropagation();setReport('${rid}','rejected')">${d("rep.rejected")}</button>`
        : "");
      // every row opens: one without a URL explains why there is no bundle,
      // which is more use to a reviewer than a row that ignores the click
      return `<tr id="rep${i}" onclick="openReport(${i})"><td><code>${esc(r.report_id)}</code></td><td>${esc(word("rep.t.", r.type))}</td>
        <td title="${esc(r.description || "")}"${r.url ? ' class="link"' : ""}>${esc(what)}</td><td>${auto}</td>
        <td>${esc(!r.reporter || r.reporter === "anonymous" ? d("rep.anon") : r.reporter)}</td><td class="muted">${esc((r.created_at || "").slice(0, 16))}</td>
        <td>${esc(statusWord(r.status))}</td><td>${act}</td></tr>`;
    }).join("");
  }catch(e){ tb.innerHTML = `<tr><td colspan="8" class="muted">${d("rep.err")}</td></tr>`; }
}
async function setReport(id, status){
  const msg = document.getElementById("repmsg");
  msg.textContent = d("rev.saving");
  try{
    const r = await (await fetch(API + "/report-status", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({report_id: id, status, reviewer: "investigator", note: ""})
    })).json();
    msg.textContent = r.ok
      ? d("rep.marked", { id, s: statusWord(status) })
        + (r.promoted_to_confirmed ? d("rep.promoted") : "")
      : ("error: " + (r.error || "could not save"));
    loadReports(); loadStats(); loadDetections();
  }catch(e){ msg.textContent = d("rev.unreach"); }
}
document.getElementById("repfilter").addEventListener("change", loadReports);

function loadAll(){ loadStats(); loadDetections(); loadReports(); }
applyLang();                                  // paints the labels, then loads
setInterval(loadStats, 60000);
</script>
