<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Detection — Investigator Console</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#15181d;--dim:#6b7280;
        --red:#c7312b;--amber:#b4740b;--green:#1d7a46;--blue:#1f4fd8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;font-weight:650}
  header span{color:var(--dim);font-size:12.5px}
  .proto{background:#fff4e5;color:#92500a;border:1px solid #f3d9b0;
         padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  main{max-width:1240px;margin:0 auto;padding:22px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
         gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .stat .n{font-size:25px;font-weight:650;letter-spacing:-.5px}
  .stat .l{color:var(--dim);font-size:12px;margin-top:2px}
  .stat.hero{border-color:#c9d6f5;background:#f4f7ff}
  .stat.hero .n{color:var(--blue)}
  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);
                      border-radius:7px;background:#fff}
  button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}
  button.ghost{background:#fff;color:var(--ink)}
  button.ok{background:var(--green);border-color:var(--green)}
  button.no{background:#fff;color:var(--red);border-color:#e7bbb9}
  .wrap{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel h2{margin:0;padding:11px 15px;font-size:12px;font-weight:650;
            border-bottom:1px solid var(--line);color:var(--dim);
            text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
  tbody tr{cursor:pointer} tbody tr:hover{background:#f9fafb}
  tbody tr.sel{background:#eef3ff}
  td.dom{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
         max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
  .CONFIRMED,.malicious{background:#fdeaea;color:var(--red)}
  .REPORTED,.SUSPICIOUS,.suspicious{background:#fdf3e2;color:var(--amber)}
  .NO_MATCH,.clean{background:#eef0f3;color:var(--dim)}
  .UNKNOWN{background:#eef0f3;color:var(--dim)}
  .tag{background:#eef0f3;color:var(--dim)}
  .detail{padding:15px}
  .detail .dom{font-family:ui-monospace,monospace;font-size:14px;font-weight:600;
               word-break:break-all;margin-bottom:9px}
  .reason{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .reason:last-child{border:0}
  .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px}
  .risk .dot{background:var(--red)} .safe .dot{background:var(--green)}
  .neutral .dot{background:var(--dim)}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;
      border-bottom:1px dashed var(--line)}
  .kv span:first-child{color:var(--dim)}
  .takedown a{display:block;padding:6px 0;color:var(--blue);text-decoration:none;font-size:13px}
  .muted{color:var(--dim);padding:18px 15px;font-size:13px}
  .advisory{color:var(--dim);font-size:11.5px;padding:10px 15px 0;font-style:italic}
</style>
</head>
<body>

<header>
  <h1>Scam Detection — Investigator Console</h1>
  <span class="proto">Prototype — not a police system</span>
  <span id="updated"></span>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="bar">
    <input id="brand" placeholder="Filter by brand…" style="width:170px">
    <select id="source">
      <option value="">All sources</option>
      <option value="certificate_transparency">Certificate Transparency</option>
      <option value="permutation_sweep">Permutation sweep</option>
    </select>
    <select id="minscore">
      <option value="0">Any score</option><option value="50">50+</option>
      <option value="80" selected>80+</option><option value="95">95+</option>
    </select>
    <button onclick="loadDetections()">Apply</button>
    <button class="ghost" onclick="loadAll()">Refresh</button>
  </div>

  <div class="wrap">
    <div class="panel">
      <h2>Detections — unverified <span id="count" style="font-weight:400"></span></h2>
      <table>
        <thead><tr><th>Domain</th><th>Brand</th><th>Score</th><th>Status</th>
                   <th>Source</th><th>First seen</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Case detail</h2>
      <div id="detail" class="muted">Select a detection to analyse it.</div>
    </div>
  </div>
</main>

<script>
// same-origin when served from the API, falls back for file:// use
const API = location.protocol.startsWith("http")
  ? location.origin : "http://127.0.0.1:8000";
let rows = [], current = null;

async function loadStats(){
  const s = await (await fetch(API + "/stats")).json();
  const r = await (await fetch(API + "/")).json();
  document.getElementById("stats").innerHTML = `
    <div class="stat hero"><div class="n">${s.unknown_to_public_feeds}</div>
      <div class="l">Unknown to every public feed</div></div>
    <div class="stat"><div class="n">${s.ct_discoveries}</div>
      <div class="l">Certificate Transparency finds</div></div>
    <div class="stat"><div class="n">${s.permutation_recent}</div>
      <div class="l">Look-alikes registered &lt; 1 year</div></div>
    <div class="stat"><div class="n">${s.permutation_with_mx}</div>
      <div class="l">With mail servers configured</div></div>
    <div class="stat"><div class="n">${r.confirmed ?? 0}</div>
      <div class="l">Confirmed by a reviewer</div></div>
    <div class="stat"><div class="n">${r.official ?? 0}</div>
      <div class="l">Verified official domains</div></div>`;
  document.getElementById("updated").textContent =
    "updated " + new Date().toLocaleTimeString();
}

async function loadDetections(){
  const p = new URLSearchParams({limit:150,
    min_score: document.getElementById("minscore").value});
  const b = document.getElementById("brand").value.trim();
  const s = document.getElementById("source").value;
  if (b) p.set("brand", b);
  if (s) p.set("source", s);

  const d = await (await fetch(API + "/detections?" + p)).json();
  rows = d.items;
  document.getElementById("count").textContent = `— ${d.showing} of ${d.total}`;
  document.getElementById("rows").innerHTML = rows.length ? rows.map((r,i) => `
    <tr onclick="pick(${i})" id="r${i}">
      <td class="dom" title="${r.domain}">${r.domain}</td>
      <td>${r.brand || "—"}</td><td><b>${Math.round(r.score)}</b></td>
      <td><span class="pill REPORTED">reported</span></td>
      <td><span class="pill tag">${r.source === "certificate_transparency" ? "CT" : "sweep"}</span></td>
      <td>${(r.first_seen||"").slice(0,10) || "—"}</td></tr>`).join("")
    : `<tr><td colspan="6" class="muted">No detections match those filters.</td></tr>`;
}

async function pick(i){
  document.querySelectorAll("tbody tr").forEach(t => t.classList.remove("sel"));
  document.getElementById("r"+i)?.classList.add("sel");
  const r = rows[i]; current = r.domain;
  const el = document.getElementById("detail");
  el.className = "detail";
  el.innerHTML = `<div class="dom">${r.domain}</div><div class="muted">Analysing…</div>`;

  let v;
  try{
    v = await (await fetch(API + "/check", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({url:r.domain, deep:true})})).json();
  }catch(e){
    el.innerHTML = `<div class="dom">${r.domain}</div>
                    <div class="muted">API unreachable.</div>`; return;
  }

  const e = v.enrichment || {};
  const age = ["< 7 days","< 30 days","< 90 days","< 1 year","1–3 years","3+ years"];
  el.innerHTML = `
    <div class="dom">${v.host}</div>
    <div style="margin-bottom:13px">
      <span class="pill ${v.status || v.verdict}">${(v.status||v.verdict).replace("_"," ")}</span>
      <span style="color:var(--dim);font-size:12px;margin-left:8px">
        risk ${v.score}/100${v.cached ? " · cached" : ""}</span>
    </div>

    <h2 style="border:0;padding:0 0 3px;margin:0">Why</h2>
    ${(v.reasons||[]).map(x =>
      `<div class="reason ${x.direction}"><div class="dot"></div><div>${x.text}</div></div>`
    ).join("") || '<div class="muted" style="padding:6px 0">No reasons returned.</div>'}

    <h2 style="border:0;padding:13px 0 3px;margin:0">Evidence</h2>
    <div class="kv"><span>Registered</span><span>${
      e.age_bucket >= 0 ? age[e.age_bucket] : "unknown"}</span></div>
    <div class="kv"><span>Certificate</span><span>${
      e.tls_free_ca ? "free CA" : (e.tls_has_org ? "verified org" : "—")}</span></div>
    <div class="kv"><span>Redirects</span><span>${e.redirect_count ?? "—"}${
      e.via_shortener ? " (via shortener)" : ""}</span></div>
    <div class="kv"><span>Cloaking</span><span>${
      e.cloaked ? "detected" : (e.cloaked === 0 ? "none" : "—")}</span></div>
    <div class="kv"><span>Password field</span><span>${e.has_password ? "yes" : "no"}</span></div>
    <div class="kv"><span>Form posts offsite</span><span>${e.form_cross_domain ? "yes" : "no"}</span></div>

    <h2 style="border:0;padding:13px 0 3px;margin:0">Review</h2>
    <div style="display:flex;gap:8px;margin:6px 0 4px">
      <button class="ok" onclick="review('confirm')">Confirm as scam</button>
      <button class="no" onclick="review('reject')">Reject</button>
      <button class="ghost" onclick="markOfficial()">Mark official</button>
    </div>
    <div id="revmsg" class="muted" style="padding:4px 0"></div>

    <h2 style="border:0;padding:13px 0 3px;margin:0">Takedown routing</h2>
    <div class="takedown">
      <a href="https://rdap.org/domain/${v.reg_domain}" target="_blank">Registrar abuse contact →</a>
      <a href="https://abuse.cloudflare.com/" target="_blank">Hosting provider / CDN abuse →</a>
      <a href="https://safebrowsing.google.com/safebrowsing/report_phish/" target="_blank">Report to Google Safe Browsing →</a>
    </div>
    <div class="advisory">${v.advisory || ""}</div>`;
}

async function review(decision){
  if (!current) return;
  const msg = document.getElementById("revmsg");
  msg.textContent = "saving…";
  try{
    const r = await (await fetch(API + "/review", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({domain: current, decision, reviewer: "investigator"})
    })).json();
    msg.textContent = r.ok
      ? `${decision === "confirm" ? "Confirmed" : "Rejected"} — ${r.confirmed} confirmed total`
      : ("error: " + r.error);
    loadStats();
  }catch(e){ msg.textContent = "could not reach the API"; }
}

async function markOfficial(){
  if (!current) return;
  const org = prompt("Organisation this domain belongs to:", "");
  if (org === null) return;
  const msg = document.getElementById("revmsg");
  msg.textContent = "saving…";
  try{
    const r = await (await fetch(API + "/official", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({domain: current, org,
                            source: "reviewer_verified",
                            added_by: "investigator"})})).json();
    msg.textContent = r.ok ? `Added to the official allowlist (${r.total} total)`
                           : "Already on the allowlist";
    loadStats();
  }catch(e){ msg.textContent = "could not reach the API"; }
}

function loadAll(){ loadStats(); loadDetections(); }
loadAll();
setInterval(loadStats, 60000);
</script>
</body>
</html>
